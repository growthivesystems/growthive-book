<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — Growthive Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<style>
  :root{
    --navy:#0A1F44;
    --navy-deep:#071630;
    --blue:#2563EB;
    --blue-light:#EFF4FF;
    --amber:#F59E0B;
    --amber-deep:#D97706;
    --border:#E5E9F0;
    --text-muted:#6B7280;
    --text-faint:#9CA3AF;
    --danger:#DC2626;
    --danger-bg:#FEF2F2;
    --success:#059669;
    --success-bg:#ECFDF5;
    --cream:#FAF9F6;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',Arial,sans-serif;
    background:var(--cream);
    margin:0;
    color:var(--navy);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .display{font-family:'Fraunces',Georgia,serif;}
  .shell{width:100%;max-width:420px;}
  .brand{
    display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;background:var(--blue);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;
  }
  .brand-name{font-weight:700;font-size:17px;color:var(--navy);}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:34px 30px;box-shadow:0 10px 30px rgba(10,31,68,0.06);
  }
  .card h1{font-size:22px;margin:0 0 8px;}
  .card .subtext{font-size:14px;color:var(--text-muted);line-height:1.55;margin:0 0 26px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;margin-top:18px;}
  label:first-of-type{margin-top:0;}
  input[type=password]{
    width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;color:var(--navy);background:#fff;
  }
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light);}
  .hint{font-size:12.5px;color:var(--text-faint);margin-top:6px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 26px;border-radius:11px;font-weight:700;font-size:14.5px;
    border:none;cursor:pointer;text-decoration:none;width:100%;
  }
  .btn-primary{background:var(--navy);color:#fff;margin-top:24px;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-primary:disabled{background:#A9C2F5;cursor:not-allowed;}
  .banner{padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:18px;display:none;}
  .banner.error{background:var(--danger-bg);color:var(--danger);display:block;}
  .banner.info{background:var(--blue-light);color:var(--navy);display:block;}
  .state-icon{
    width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:24px;margin:0 auto 18px;
  }
  .state-icon.success{background:var(--success-bg);color:var(--success);}
  .state-icon.error{background:var(--danger-bg);color:var(--danger);}
  .center{text-align:center;}
  .back-link{
    display:block;text-align:center;margin-top:20px;font-size:13.5px;color:var(--text-muted);text-decoration:none;
  }
  .back-link:hover{color:var(--navy);}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
<body>

<div class="shell">
  <div class="brand">
    <div class="brand-mark">G</div>
    <div class="brand-name">Growthive Book</div>
  </div>

  <div class="card" id="card">
    <div class="state-message center" style="padding:20px 0;color:var(--text-muted);font-size:14.5px;">
      Checking your reset link…
    </div>
  </div>

  <a href="login.html" class="back-link">← Back to login</a>
</div>

<script>
  const sb = supabaseClient;
  const card = document.getElementById('card');

  let recoveryReady = false;

  function renderForm(){
    card.innerHTML = `
      <h1 class="display">Choose a new password</h1>
      <p class="subtext">Make it something you haven't used here before. You'll be signed in automatically once it's set.</p>
      <div class="banner error" id="errorBanner" style="display:none;"></div>
      <form id="resetForm">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Re-enter your password" required minlength="8">
        <p class="hint">Use at least 8 characters. A mix of letters and numbers is a good idea.</p>
        <button type="submit" class="btn btn-primary" id="submitBtn">Update password</button>
      </form>
    `;
    document.getElementById('resetForm').addEventListener('submit', handleSubmit);
  }

  function renderInvalidLink(){
    card.innerHTML = `
      <div class="state-icon error">!</div>
      <h1 class="display center">This link isn't working</h1>
      <p class="subtext center">
        Password reset links expire after a while, or may have already been used.
        Request a new one from the login page and try again.
      </p>
      <a href="login.html" class="btn btn-primary" style="text-decoration:none;">Back to login</a>
    `;
  }

  function renderSuccess(){
    card.innerHTML = `
      <div class="state-icon success">✓</div>
      <h1 class="display center">Password updated</h1>
      <p class="subtext center">
        Your password has been changed. Taking you to your dashboard…
      </p>
    `;
    setTimeout(() => { window.location.href = 'business-hub.html'; }, 1800);
  }

  async function handleSubmit(e){
    e.preventDefault();
    const errorBanner = document.getElementById('errorBanner');
    errorBanner.style.display = 'none';

    const pw = document.getElementById('newPassword').value;
    const confirmPw = document.getElementById('confirmPassword').value;

    if (pw.length < 8){
      errorBanner.textContent = 'Password must be at least 8 characters.';
      errorBanner.style.display = 'block';
      return;
    }
    if (pw !== confirmPw){
      errorBanner.textContent = "Those passwords don't match. Please re-enter them.";
      errorBanner.style.display = 'block';
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Updating…';

    const { error } = await sb.auth.updateUser({ password: pw });

    if (error){
      errorBanner.textContent = 'Something went wrong: ' + error.message + '. Please try again.';
      errorBanner.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Update password';
      return;
    }

    renderSuccess();
  }

  // Supabase sends the recovery token in the URL hash and fires a
  // PASSWORD_RECOVERY auth event once it's processed the link. We wait for
  // that event (or an existing recovery session) before showing the form —
  // showing it too early would let someone submit against no valid session.
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session){
      recoveryReady = true;
      renderForm();
    }
  });

  // Fallback: some Supabase versions/redirect configs resolve the session
  // before onAuthStateChange fires, or don't emit PASSWORD_RECOVERY at all
  // if the page was already loaded. Check directly after a short delay.
  setTimeout(async () => {
    if (recoveryReady) return;
    const { data } = await sb.auth.getSession();
    if (data && data.session){
      recoveryReady = true;
      renderForm();
    } else {
      renderInvalidLink();
    }
  }, 1200);
</script>

</body>
</html>
